name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/beyond_notes
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/beyond_notes_test
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  BETTER_AUTH_URL: http://localhost:3000
  CRON_SECRET: ci-only-cron-secret-ci-only-cron-secret-0000

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyond_notes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Create test database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database beyond_notes_test"
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          tags: beyond-notes:ci
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          tags: beyond-notes-migrate:ci
          load: true
          cache-from: type=gha,scope=app
      - name: Smoke test (container serves and reports healthy)
        run: |
          docker run -d --name app --init --read-only --tmpfs /tmp \
            --tmpfs /app/.next/cache:uid=1000,gid=1000 --cap-drop ALL \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:5432/none \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 48)" \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -p 3000:3000 beyond-notes:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
